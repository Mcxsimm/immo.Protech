<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Semainier — menus équilibrés et liste de courses</title>
  <meta name="description" content="Choisissez le nombre de repas, le nombre de convives et votre envie du moment : Semainier compose une semaine équilibrée à partir de 200 recettes et en déduit une liste de courses optimisée, rangée par rayon.">
  <meta name="theme-color" content="#2f7d5b">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

  <header class="appbar">
    <div class="appbar-in">
      <div class="logo">
        <span class="pastille" aria-hidden="true">🥗</span>
        <span>Semainier<small>menus équilibrés &amp; courses</small></span>
      </div>
      <div class="spacer"></div>
      <button class="icone-bouton" data-action="theme" title="Changer de thème" aria-label="Changer de thème">◐</button>
      <button class="icone-bouton" data-action="reinitialiser" title="Tout réinitialiser" aria-label="Tout réinitialiser">⟲</button>
    </div>
    <div class="appbar-in" style="padding-top:0">
      <nav class="onglets" id="onglets" role="tablist" aria-label="Sections"></nav>
    </div>
  </header>

  <main class="enveloppe" id="vue" role="main"></main>

  <div class="barre-basse" id="barreBasse" hidden></div>

  <div id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
       background:#23201c;color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;opacity:0;
       transition:opacity .25s;pointer-events:none;z-index:200;max-width:90vw;text-align:center"></div>

  <noscript>
    <div class="enveloppe">
      <div class="carte carte-p" style="margin-top:24px">
        <h2>JavaScript est nécessaire</h2>
        <p>Semainier compose les menus et la liste de courses directement dans votre navigateur :
          activez JavaScript pour l’utiliser.</p>
      </div>
    </div>
  </noscript>

  <script src="assets/data/ingredients.js"></script>
  <script src="assets/data/recipes.js"></script>
  <script src="assets/data/recipes-maison.js"></script>
  <script src="assets/js/nutrition.js"></script>
  <script src="assets/js/planner.js"></script>
  <script src="assets/js/shopping.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/custom.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
